name: Publish stable release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify version 0.8.0 metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          component = Path("custom_components/suris_ef_ble_xboost")
          manifest = json.loads((component / "manifest.json").read_text(encoding="utf-8"))
          if manifest["version"] != "0.8.0":
              raise SystemExit(f"Unexpected version: {manifest['version']}")
          expected_name = "Suris EcoFlow BLE — 100% Local BLE (Unofficial)"
          if manifest["name"] != expected_name:
              raise SystemExit(f"Unexpected integration name: {manifest['name']}")
          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          if hacs["name"] != expected_name:
              raise SystemExit(f"Unexpected HACS name: {hacs['name']}")
          PY

      - name: Validate release files
        run: |
          python3 -m json.tool hacs.json >/dev/null
          python3 -m json.tool custom_components/suris_ef_ble_xboost/manifest.json >/dev/null
          python3 -m json.tool custom_components/suris_ef_ble_xboost/strings.json >/dev/null
          python3 -m json.tool custom_components/suris_ef_ble_xboost/translations/en.json >/dev/null
          python3 -m json.tool custom_components/suris_ef_ble_xboost/translations/uk.json >/dev/null
          python3 -m compileall -q custom_components/suris_ef_ble_xboost
          git diff --check

      - name: Build source archive with license notices
        run: python3 scripts/build_release.py

      - name: Build HACS installation archive
        shell: bash
        run: |
          set -euo pipefail
          cd custom_components/suris_ef_ble_xboost
          zip -r "$GITHUB_WORKSPACE/dist/suris_ef_ble_xboost.zip" . -x "__pycache__/" "__pycache__/*" "*/__pycache__/" "*/__pycache__/*" "*.pyc" "*.pyo"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum suris_ef_ble_xboost.zip > suris_ef_ble_xboost.zip.sha256

      - name: Verify HACS archive layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path("dist/suris_ef_ble_xboost.zip")
          with ZipFile(archive_path) as archive:
              names = {name.rstrip("/") for name in archive.namelist()}

          required = {"manifest.json", "__init__.py"}
          missing = sorted(required - names)
          nested = sorted(
              name
              for name in names
              if name.startswith("suris_ef_ble_xboost/")
              or name.startswith("custom_components/")
          )
          if missing or nested:
              raise SystemExit(
                  f"Invalid HACS archive layout: missing={missing}, nested={nested[:5]}"
              )
          print(f"Verified HACS archive with {len(names)} entries")
          PY

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/suris_ef_ble_xboost/manifest.json"))["version"])')
          TAG="v${VERSION}"
          TARGET_SHA=$(git rev-parse HEAD)
          ASSETS=(
            "dist/suris_ef_ble_${VERSION}.zip"
            "dist/suris_ef_ble_${VERSION}.zip.sha256"
            "dist/suris_ef_ble_xboost.zip"
            "dist/suris_ef_ble_xboost.zip.sha256"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "Suris EcoFlow BLE ${VERSION} — 100% local BLE / No internet required — UNOFFICIAL" \
              --notes-file RELEASE_NOTES.md \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET_SHA" \
              --title "Suris EcoFlow BLE ${VERSION} — 100% local BLE / No internet required — UNOFFICIAL" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
